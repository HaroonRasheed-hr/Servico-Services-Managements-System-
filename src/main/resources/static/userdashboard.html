<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>SERVICO - User Dashboard</title>
   <!-- ✅ flatpickr CSS -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

   <!-- ✅ flatpickr JS -->
   <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
   <style>
      :root {
         --primary: #4a90e2;
         --secondary: #6c5ce7;
         --accent: #ff7675;
         --dark: #2d3436;
         --light: #f5f6fa;
         --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
         --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
         --font: 'Segoe UI', system-ui;
      }

      body {
         margin: 0;
         font-family: var(--font);
         background: var(--light);
         color: var(--dark);
         padding-top: 100px;
      }

      h2 {
         text-align: center;
         color: var(--primary);
         margin-top: 1rem;
      }

      .grid-section {
         margin: 2rem;
      }

      .grid-title {
         font-size: 1.4rem;
         margin-bottom: 1rem;
         color: var(--secondary);
      }

      .service-grid {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
         gap: 1.5rem;
      }

      .card {
         background: white;
         border-radius: 12px;
         padding: 1rem;
         box-shadow: var(--shadow);
         display: flex;
         flex-direction: column;
         gap: 0.5rem;
      }

      .status {
         padding: 0.3rem 0.7rem;
         border-radius: 8px;
         font-size: 0.9rem;
         font-weight: bold;
         display: inline-block;
      }

      .status.pending {
         background: #ffeaa7;
         color: #d35400;
      }

      .status.working {
         background: #81ecec;
         color: #00695c;
      }

      .status.completed {
         background: #dfe6e9;
         color: #2d3436;
      }

      .review-stars {
         color: var(--accent);
         font-size: 1.2rem;
      }

      .review-btn {
         background: var(--gradient);
         color: white;
         padding: 8px 14px;
         border: none;
         border-radius: 8px;
         font-weight: 600;
         cursor: pointer;
         margin-top: 10px;
         transition: all 0.3s ease;
      }

      .review-btn:hover {
         transform: scale(1.03);
         box-shadow: var(--shadow);
      }

      .rating-out-of {
         font-size: 0.9rem;
         color: var(--dark);
      }

      .modal {
         display: none;
         position: fixed;
         z-index: 999;
         left: 0;
         top: 0;
         width: 100%;
         height: 100%;
         background: rgba(0, 0, 0, 0.5);
         justify-content: center;
         align-items: center;
      }

      .modal-content {
         background: white;
         padding: 2rem;
         border-radius: 10px;
         max-width: 400px;
         width: 90%;
      }

      .modal-content h3 {
         margin-top: 0;
         color: var(--primary);
      }

      .stars {
         display: flex;
         gap: 0.5rem;
         margin: 1rem 0;
      }

      .stars i {
         font-size: 1.5rem;
         color: #ccc;
         cursor: pointer;
      }

      .stars i.active {
         color: var(--accent);
      }

      .submit-review {
         background: var(--gradient);
         color: white;
         padding: 10px 18px;
         border: none;
         border-radius: 8px;
         cursor: pointer;
      }

      .header {
         background: rgba(255, 255, 255, 0.95);
         backdrop-filter: blur(10px);
         position: fixed;
         width: 100%;
         top: 0;
         z-index: 1000;
         box-shadow: var(--shadow);
      }

      .nav-container {
         max-width: 1200px;
         margin: 0 auto;
         padding: 1rem;
         display: flex;
         justify-content: space-between;
         align-items: center;
      }

      .logo {
         display: flex;
         align-items: center;
         gap: 1rem;
         color: var(--primary);
         text-decoration: none;
      }

      .nav-links {
         display: flex;
         gap: 2rem;
         align-items: center;
      }

      .nav-links a {
         text-decoration: none;
         color: var(--dark);
         padding: 0.5rem 1rem;
         border-radius: 0.5rem;
      }

      .nav-links a:hover {
         background: var(--primary);
         color: white;
      }



      .profile-container {
         position: relative;
         display: inline-block;
      }

      .profile-btn {
         background-color: #3498db;
         color: white;
         padding: 10px 15px;
         border: none;
         border-radius: 5px;
         cursor: pointer;
      }

      .profile-menu {
         display: none;
         position: absolute;
         top: 100%;
         right: 0;
         background-color: white;
         box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
         border-radius: 5px;
         overflow: hidden;
         z-index: 1000;
      }

      .profile-menu.show {
         display: block;
      }

      .profile-menu a {
         display: block;
         padding: 10px 15px;
         text-decoration: none;
         color: black;
         background-color: white;
      }

      .profile-menu a:hover {
         background-color: #f0f0f0;
      }




      /* Dark Theme */
      [data-theme="dark"] {
         --light: var(--dark);
         --dark: #f5f6fa;
      }

      [data-theme="dark"] .header {
         background: rgba(45, 45, 45, 0.95);
      }

      [data-theme="dark"] .modal-content {
         background: var(--dark);
         color: var(--light);
      }

      [data-theme="dark"] .service-card,
      [data-theme="dark"] .review-card {
         background: rgba(45, 45, 45, 0.9);
      }

      [data-theme="dark"] .about {
         background: rgba(45, 45, 45, 0.9);
      }

      [data-theme="dark"] .about p,
      [data-theme="dark"] .stat-item {
         color: var(--light);
      }

      .theme-toggle {
         background: var(--primary);
         color: white;
         border: none;
         padding: 0.5rem 1rem;
         border-radius: 0.5rem;
         cursor: pointer;
      }

      table {
         border-collapse: collapse;
         width: 100%;
         margin-top: 1rem;
         box-shadow: var(--shadow);
         background: white;
         border-radius: 10px;
         overflow: hidden;
      }

      th,
      td {
         padding: 0.75rem;
         border-bottom: 1px solid #ddd;
         text-align: left;
      }

      thead {
         background: var(--primary);
         color: white;
      }
   </style>
   <link rel="stylesheet" href="responsive.css">
</head>

<body>

   <!-- HEADER -->
   <header class="header">
      <nav class="nav-container">
         <div class="logo">
            <i class="fas fa-handshake"></i>
            <h1>SERVICO</h1>
         </div>
         <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#review">Reviews</a>
            <a href="#contact1">Contact</a>
            <button class="theme-toggle"><i class="fas fa-moon"></i></button>
         </div>
         <div class="profile-container">
            <button class="profile-btn">
               <span id="profile-username">User</span> ⬇
            </button>
            <div class="profile-menu">
               <a id="home" href="indexlogin.html">Home</a>
               <a id="logoutBtn" href="#">Logout</a>
            </div>
         </div>


      </nav>
   </header>
   <!-- DASHBOARD CONTENT -->
   <h2>User Dashboard</h2>

   <div class="grid-section">
      <div class="grid-title">Your Bookings</div>
      <div style="overflow-x:auto;">
         <table style="width: 100%; border-collapse: collapse;">
            <thead>
               <tr>
                  <th>Service</th>
                  <th>Company</th>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Type</th>
                  <th>Location</th>
                  <th>Status</th>
               </tr>
            </thead>
            <tbody id="userBookingTableBody">
               <!-- Bookings will be inserted here -->
            </tbody>
         </table>
      </div>
   </div>


   <!-- REVIEW MODAL -->
   <div class="modal" id="reviewModal">
      <div class="modal-content">
         <h3>Add Your Review</h3>
         <div class="stars" id="starContainer">
            <i class="fa fa-star" data-star="1"></i>
            <i class="fa fa-star" data-star="2"></i>
            <i class="fa fa-star" data-star="3"></i>
            <i class="fa fa-star" data-star="4"></i>
            <i class="fa fa-star" data-star="5"></i>
         </div>
         <textarea id="reviewText" placeholder="Write your review here..." rows="4" maxlength="700"
            style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none;"></textarea>
         <small id="wordCount" style="display: block; margin-top: 5px; color: gray;">0/100 words</small>
         <button class="submit-review">Submit Review</button>
      </div>
   </div>

   <script src="app.js"></script>

   <script src="responsive.js" defer></script>
</body>

</html>
