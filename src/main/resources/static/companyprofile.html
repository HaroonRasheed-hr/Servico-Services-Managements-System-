<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Company Profile</title>
   <link rel="stylesheet" href="styles.css">
   <style>
      :root {
         --primary: #4a90e2;
         --secondary: #6c5ce7;
         --accent: #ff7675;
         --dark: #2d3436;
         --light: #f5f6fa;
         --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
         --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
         --font: 'Segoe UI', system-ui;
      }

      body {
         font-family: var(--font);
         background: var(--light);
         margin: 0;
         padding: 20px;
      }

      .profile-container {
         max-width: 1200px;
         margin: 0 auto;
         background: white;
         border-radius: 12px;
         padding: 20px;
         box-shadow: var(--shadow);
      }

      .company-header {
         text-align: center;
         padding-bottom: 20px;
         border-bottom: 2px solid var(--primary);
      }

      .company-header h1 {
         margin-bottom: 10px;
         color: var(--primary);
      }

      .info {
         margin: 10px 0;
         color: var(--dark);
      }

      .section-title {
         margin-top: 30px;
         font-size: 1.5em;
         color: var(--secondary);
         border-left: 5px solid var(--accent);
         padding-left: 10px;
      }

      .grid {
         display: grid;
         grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
         gap: 20px;
         margin-top: 20px;
      }

      .card {
         background: var(--light);
         padding: 15px;
         border-radius: 12px;
         box-shadow: var(--shadow);
         border-left: 5px solid var(--primary);
      }

      .card h3 {
         margin: 0;
         color: var(--primary);
      }

      .card p {
         margin: 5px 0;
         color: var(--dark);
      }

      .rating-stars {
         color: gold;
         font-size: 1.2em;
      }
   </style>
</head>

<body>

   <div class="profile-container">
      <div class="company-header">
         <h1 id="companyName"></h1>
         <p class="info" id="companyEmail"></p>
         <p class="info" id="companyPhone"></p>
         <p class="info" id="companyAddress"></p>
      </div>

      <h2 class="section-title">Services</h2>
      <div class="grid" id="servicesGrid"></div>

      <h2 class="section-title">Customer Reviews</h2>
      <div class="grid" id="reviewsGrid"></div>
   </div>

   <script src="app.js"></script>
</body>

</html>
