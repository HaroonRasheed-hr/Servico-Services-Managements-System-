<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Servico | Servico Dashboard</title>
   <link rel="stylesheet" href="styles.css" />
   <style>
      body {
         font-family: 'Segoe UI', system-ui;
         background-color: #f0f2f5;
         margin: 0;
         padding: 0;
      }

      .dashboard-container {
         max-width: 1000px;
         margin: 110px auto;
         padding: 30px;
         background-color: #fff;
         border-radius: 16px;
         box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .dashboard-header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: 20px;
      }

      .dashboard-header h2 {
         font-size: 26px;
         color: #0077cc;
      }

      .logout-btn {
         background-color: #ff4d4d;
         color: #fff;
         border: none;
         padding: 10px 20px;
         border-radius: 8px;
         font-weight: bold;
         cursor: pointer;
      }

      .filters {
         display: flex;
         justify-content: space-between;
         flex-wrap: wrap;
         gap: 15px;
         margin-bottom: 20px;
      }

      .filters input,
      .filters select {
         padding: 10px;
         font-size: 16px;
         border: 1px solid #ccc;
         border-radius: 8px;
         width: 48%;
         max-width: 300px;
      }

     
      table {
         border-collapse: collapse;
         width: 100%;
         margin-top: 1rem;
         box-shadow: var(--shadow);
         background: white;
         border-radius: 10px;
         overflow: hidden;
      }

      th,
      td {
         padding: 0.75rem;
         border-bottom: 1px solid #ddd;
         text-align: left;
      }

      thead {
         background: var(--primary);
         color: white;
      }
   

      .action-buttons button {
         background-color: #0077cc;
         color: white;
         border: none;
         padding: 8px 12px;
         margin: 3px;
         border-radius: 6px;
         cursor: pointer;
         font-weight: 500;
      }

      .action-buttons button:hover {
         background-color: #005fa3;
      }

      .status.approved {
         color: green;
         font-weight: bold;
      }

      .status.rejected {
         color: red;
         font-weight: bold;
      }

      .status.pending {
         color: orange;
         font-weight: bold;
      }



      /* Base styles (desktop first or common) */
      body {
         font-family: 'Segoe UI', system-ui;
         background-color: #f0f2f5;
         margin: 0;
         padding: 0;
      }

      .dashboard-container {
         max-width: 1000px;
         margin: 110px auto;
         padding: 30px;
         background-color: #fff;
         border-radius: 16px;
         box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .filters input,
      .filters select {
         width: 48%;
         max-width: 300px;
      }

      /* 720px and below */
      @media (max-width: 720px) {
         .dashboard-container {
            margin: 80px 15px;
            padding: 20px;
         }

         .filters {
            flex-direction: column;
            gap: 10px;
         }

         .filters input,
         .filters select {
            width: 100%;
         }

         table {
            font-size: 14px;
         }

         .action-buttons button {
            padding: 6px 10px;
            font-size: 14px;
         }
      }

      /* 540px and below */
      @media (max-width: 540px) {
         .dashboard-header h2 {
            font-size: 20px;
         }

         .logout-btn {
            padding: 8px 16px;
            font-size: 14px;
         }

         table th,
         table td {
            padding: 10px;
         }

         .nav-container {
            flex-direction: column;
            align-items: center;
            gap: 10px;
         }

         .nav-links a {
            display: block;
            margin: 5px 0;
         }
      }

      /* 360px and below */
      @media (max-width: 360px) {
         .dashboard-header h2 {
            font-size: 18px;
         }

         .filters input,
         .filters select {
            font-size: 14px;
         }

         .action-buttons button {
            padding: 5px 8px;
            font-size: 12px;
         }

         table {
            font-size: 12px;
         }

         .profile-btn {
            font-size: 14px;
         }
      }
   </style>

   <link rel="stylesheet" href="responsive.css">
</head>

<body>
   <header class="header">
      <nav class="nav-container">
         <div class="logo">
            <i class="fas fa-handshake"></i>
            <h1>SERVICO</h1>
         </div>
         <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#review">Reviews</a>
            <a href="#contact1">Contact</a>
         </div>
         <div class="profile-container">
            <button class="profile-btn">
               <span id="profile-username">Admin</span> ⬇
            </button>
            <div class="profile-menu">
               <a id="logoutBtn" href="#">Logout</a>
            </div>
         </div>
      </nav>
   </header>

   <div class="dashboard-container">
      <div class="dashboard-header">
         <h2>Servico Dashboard</h2>
         <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="filters">
         <input type="text" id="searchInput" placeholder="Search by company name..." oninput="applyFilters()">
         <select id="statusFilter" onchange="applyFilters()">
            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
         </select>
      </div>

      <table>
         <thead>
            <tr>
               <th>Company</th>
               <th>Email</th>
               <th>Phone</th>
               <th>Address</th>
               <th>Service</th>
               <th>Status</th>
               <th>Action</th>
            </tr>
         </thead>
         <tbody id="companyTableBody">
            <!-- Companies will be loaded here -->
         </tbody>
      </table>
   </div>
   <script>
      async function updateCompanyStatus(id, newStatus) {
         if (!confirm(`Are you sure you want to ${newStatus} this company?`)) return;

         try {
            const response = await fetch(`http://localhost:8080/api/admin/companies/${id}/status?status=${newStatus}`, {
               method: "PUT"
            });

            const text = await response.text();
            alert(text);
            loadCompanies();
         } catch (err) {
            console.error("Error updating status:", err);
            alert("Error updating status.");
         }
      }

      async function loadCompanies() {
         try {
            const response = await fetch("http://localhost:8080/api/admin/companies");
            const raw = await response.text();
            console.log("🔍 Raw response:", raw);

            if (!response.ok) {
               throw new Error(`Server error: ${raw}`);
            }

            let companies;
            try {
               companies = JSON.parse(raw);
            } catch (parseErr) {
               console.error("JSON parse failed:", parseErr, "Raw:", raw);
               throw new Error("Invalid JSON response from server");
            }

            const table = document.getElementById("companyTableBody");
            table.innerHTML = "";

            companies.forEach(c => {
               const tr = document.createElement("tr");
               tr.innerHTML = `
                 <td>${c.name}</td>
                 <td>${c.email}</td>
                 <td>${c.phone}</td>
                 <td>${c.address}</td>
                 <td>${c.services}</td>
                 <td class="status ${c.status.toLowerCase()}">${c.status}</td>
                 <td class="action-buttons">
                   <button onclick="updateCompanyStatus(${c.id}, 'Approved')">Approve</button>
                   <button onclick="updateCompanyStatus(${c.id}, 'Rejected')">Reject</button>
                 </td>`;
               table.appendChild(tr);
            });

         } catch (err) {
            console.error("Error loading companies:", err);
            alert("Error loading companies. See console for details.");
         }
      }

      document.addEventListener("DOMContentLoaded", loadCompanies);
   </script>



   <script src="responsive.js" defer></script>
</body>

</html>
