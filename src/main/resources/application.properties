spring.application.name=Servico
server.port=8080

# --- Default datasource: in-memory H2, so the app starts with no external DB ---
spring.datasource.url=jdbc:h2:mem:servico;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Mail (read by MailConfig; override with env vars, never commit real values) ---
app.mail.host=smtp.gmail.com
app.mail.port=587
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}

logging.level.org.springframework.security=INFO
