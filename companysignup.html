<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Company Signup</title>
   <link rel="stylesheet" href="styles.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
   <form id="company-signup-form">
      <h2>Company Signup</h2>
      <label for="name">Company Name:</label>
      <input type="text" id="companyname" name="name" required>

      <label for="services">Services:</label>
      <input type="text" id="services" name="services" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" required>

      <label for="company-username">Username:</label>
      <input type="text" id="company-username" name="company-username" autocomplete="username" required>


      <label for="password">Password:</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>



      <button type="submit">Signup</button>
   </form>
